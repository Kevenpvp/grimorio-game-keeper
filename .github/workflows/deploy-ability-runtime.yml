name: Deploy Supabase ability-runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/ability-runtime/**"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Edge Function
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy ability-runtime
        run: supabase functions deploy ability-runtime --project-ref "$SUPABASE_PROJECT_ID" --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
